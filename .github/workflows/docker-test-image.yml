name: Build Docker Test Image

on:
  push:
    branches: [arong]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ARM64_TOOLCHAIN: "zigcc"
  ZIG_VERSION: "0.17.1"
  GOAMD64: "v1"
  GOARM64: "v8.0"
  MUSL_TOOLCHAIN_VERSION: "2025-6-20"
  MUSL_TOOLCHAIN_ARCHIVE: "aarch64-linux-musl-cross.tgz"
  MUSL_TOOLCHAIN_SHA256: ""

jobs:
  frontend-checks:
    if: github.ref == 'refs/heads/arong'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec eslint .
          pnpm exec stylelint "src/**/*.{vue,css,scss}"
          pnpm type-check
          pnpm test:unit
          pnpm i18n:check

  build:
    if: github.ref == 'refs/heads/arong'
    name: Build backend (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies and build frontend
        working-directory: ./web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build --mode production

      - name: Verify embedded template assets
        run: |
          set -euo pipefail
          test -d template/dist
          test -n "$(ls -A template/dist)"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: "**/go.sum"

      - name: Set Go proxy
        run: go env -w GOPROXY=https://proxy.golang.org,direct

      - name: Setup Zig for Cross-compilation
        if: matrix.goarch == 'amd64' || env.ARM64_TOOLCHAIN == 'zigcc'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Musl for ARM64 Cross-compilation (fallback)
        if: matrix.goarch == 'arm64' && env.ARM64_TOOLCHAIN == 'musl'
        uses: ./.github/actions/setup-musl-toolchain
        with:
          toolchain-version: ${{ env.MUSL_TOOLCHAIN_VERSION }}
          archive-name: ${{ env.MUSL_TOOLCHAIN_ARCHIVE }}
          archive-sha256: ${{ env.MUSL_TOOLCHAIN_SHA256 }}

      - name: Build backend binary with embedded frontend
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          ARM64_TOOLCHAIN: ${{ env.ARM64_TOOLCHAIN }}
        run: |
          set -euo pipefail
          GIT_COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION_PKG="github.com/lin-snow/ech0/internal/version"
          STATIC_LDFLAGS="-linkmode external -extldflags '-static' -X ${VERSION_PKG}.Commit=${GIT_COMMIT} -X ${VERSION_PKG}.BuildTime=${BUILD_TIME}"
          OUTPUT_NAME="ech0-linux-${{ matrix.goarch }}"

          # Released binaries must run on pre-Haswell x86-64 CPUs (no AVX2/BMI/FMA) and
          # on the oldest arm64 cores, so they never link the runner's system libc.
          # gcc + `-static` bakes the runner image's glibc into the binary and its ISA
          # baseline drifts with `ubuntu-latest`: v5.9.10 was linked against a glibc
          # built for x86-64-v3 and SIGILL'd on an Ivy Bridge Xeon. zig cc ships its
          # own musl and a CPU baseline that does not depend on the runner image.
          case "${{ matrix.goarch }}" in
            amd64) ZIG_TARGET="x86_64-linux-musl" ;;
            arm64) ZIG_TARGET="aarch64-linux-musl" ;;
            *) echo "::error::unsupported matrix.goarch '${{ matrix.goarch }}'"; exit 1 ;;
          esac

          if [ "${{ matrix.goarch }}" = "arm64" ] && [ "${ARM64_TOOLCHAIN}" != "zigcc" ]; then
            export CC="aarch64-linux-musl-gcc"
          else
            export CC="zig cc -target ${ZIG_TARGET} -mcpu=baseline"
            export CXX="zig c++ -target ${ZIG_TARGET} -mcpu=baseline"
          fi

          # go-sqlite3 only ships sqlite3-binding.h, which sqlite-vec includes as
          # sqlite3.h, and musl headers lack the BSD u_int*_t aliases it uses.
          SQLITE_INC="${RUNNER_TEMP}/sqlite-include"
          mkdir -p "${SQLITE_INC}"
          go mod download github.com/mattn/go-sqlite3
          MATTN_DIR="$(go list -m -f '{{.Dir}}' github.com/mattn/go-sqlite3)"
          if [ -z "${MATTN_DIR}" ] || [ ! -f "${MATTN_DIR}/sqlite3-binding.h" ]; then
            echo "::error::could not locate go-sqlite3 header (MATTN_DIR='${MATTN_DIR}')" >&2
            exit 1
          fi
          cp "${MATTN_DIR}/sqlite3-binding.h" "${SQLITE_INC}/sqlite3.h"
          export CGO_CFLAGS="-I${SQLITE_INC} -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t -Wno-typedef-redefinition -fno-sanitize=undefined"

          test -f cmd/ech0/main.go
          go build -tags netgo -ldflags "$STATIC_LDFLAGS" -o "${OUTPUT_NAME}" ./cmd/ech0/main.go

      - name: Verify static link and x86-64 ISA baseline
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          BIN="ech0-linux-${{ matrix.goarch }}"
          file "${BIN}"
          python3 - "${BIN}" <<'PY'
          import struct, sys

          path = sys.argv[1]
          d = open(path, 'rb').read()
          if d[:4] != b'\x7fELF' or d[4] != 2 or d[5] != 1:
              sys.exit(f'{path}: not a 64-bit little-endian ELF')

          e_phoff, = struct.unpack_from('<Q', d, 0x20)
          e_shoff, = struct.unpack_from('<Q', d, 0x28)
          e_phentsize, = struct.unpack_from('<H', d, 0x36)
          e_phnum, = struct.unpack_from('<H', d, 0x38)
          e_shentsize, = struct.unpack_from('<H', d, 0x3a)
          e_shnum, = struct.unpack_from('<H', d, 0x3c)

          for i in range(e_phnum):
              p_type, = struct.unpack_from('<I', d, e_phoff + i * e_phentsize)
              if p_type == 3:
                  sys.exit('::error::binary is dynamically linked (PT_INTERP present)')

          masks = set()
          for i in range(e_shnum):
              sh = e_shoff + i * e_shentsize
              sh_type, = struct.unpack_from('<I', d, sh + 4)
              if sh_type != 7:
                  continue
              sh_off, sh_size = struct.unpack_from('<QQ', d, sh + 24)
              pos, end = sh_off, sh_off + sh_size
              while pos + 12 <= end:
                  namesz, descsz, ntype = struct.unpack_from('<III', d, pos)
                  pos += 12
                  name = d[pos:pos + namesz].rstrip(b'\0')
                  pos = (pos + namesz + 3) & ~3
                  desc = d[pos:pos + descsz]
                  pos = (pos + descsz + 3) & ~3
                  if name != b'GNU' or ntype != 5:
                      continue
                  q = 0
                  while q + 8 <= len(desc):
                      ptype, psz = struct.unpack_from('<II', desc, q)
                      q += 8
                      if ptype == 0xC0008002 and psz >= 4:
                          masks.add(struct.unpack_from('<I', desc, q)[0])
                      q = (q + psz + 7) & ~7

          print(f'static: yes, GNU_PROPERTY_X86_ISA_1_NEEDED: {sorted(masks) or "absent"}')
          over = sorted(m for m in masks if m & ~1)
          if over:
              sys.exit(f'::error::binary requires x86-64 ISA mask 0x{over[0]:x}; it would SIGILL on a CPU without AVX2, as v5.9.10 did')
          PY

      - name: Smoke test
        if: matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          ./ech0-linux-${{ matrix.goarch }} version

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: ech0-linux-${{ matrix.goarch }}-asset
          path: ech0-linux-${{ matrix.goarch }}
          retention-days: 1

  build-and-push-image:
    name: Build and push test image
    runs-on: ubuntu-latest
    needs: [build, frontend-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download backend artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ech0-linux-*-asset
          path: ./backend-artifacts
          merge-multiple: true

      - name: Set image and tags
        id: meta
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LC}/ech0"
          {
            echo "image=${IMAGE}"
            echo "tag=arong"
            echo "tags=${IMAGE}:arong"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Print pull command
        run: |
          echo "### Docker image for testing" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pull: \`docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
