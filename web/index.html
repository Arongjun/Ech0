<!doctype html>
<html lang="zh-CN" class="app-loading">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta
      name="twitter:description"
      content="Ech0 is a next-generation open-source self-hosted platform built for individuals. It is lightweight and low-cost, making it easy to publish and share your ideas, writing, and links."
    />
    <meta name="twitter:image" content="/Ech0.png" />

    <link rel="alternate" type="application/atom+xml" title="Ech0 Atom Feed" href="/rss" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="manifest" href="/app.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ech0" />
    <meta name="theme-color" content="#f3f7fb" />
    <meta
      name="description"
      content="Ech0 is a next-generation open-source self-hosted platform built for individuals. It is lightweight and low-cost, making it easy to publish and share your ideas, writing, and links."
    />
    <meta
      name="keywords"
      content="Ech0, open-source, sharing, thoughts, text, links, privacy, data control, platform, web app"
    />
    <meta name="author" content="Ech0 Team" />
    <meta name="generator" content="Ech0" />

    <title>Ech0</title>

    <script id="website-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Ech0",
        "description": "Ech0 is a next-generation open-source self-hosted platform built for individuals. It is lightweight and low-cost, making it easy to publish and share your ideas, writing, and links.",
        "publisher": {
          "@type": "Organization",
          "name": "Ech0 Team"
        },
        "sameAs": ["https://github.com/lin-snow/Ech0"]
      }
    </script>

    <style>
      html.app-loading,
      html.app-loading body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        gap: 16px;
        color: #1d1d1f;
        background:
          radial-gradient(circle at 18% -10%, rgba(255, 255, 255, 0.98), transparent 25rem),
          radial-gradient(circle at 88% 0%, rgba(10, 132, 255, 0.16), transparent 31rem),
          radial-gradient(circle at 56% 48%, rgba(255, 255, 255, 0.68), transparent 23rem),
          linear-gradient(135deg, #fbfcfe 0%, #f6f9fc 44%, #edf4fb 100%);
        transition:
          opacity 0.28s ease,
          visibility 0.28s ease;
      }

      #app-loader::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 15px,
            rgba(10, 132, 255, 0.026) 16px
          ),
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 15px,
            rgba(31, 38, 50, 0.018) 16px
          );
        pointer-events: none;
      }

      .loader-shell {
        width: 94px;
        height: 94px;
        margin: 0 auto;
        position: relative;
      }

      .loader-shell::after {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.72);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 16px 34px rgba(42, 55, 74, 0.1),
          0 2px 8px rgba(42, 55, 74, 0.055);
        backdrop-filter: blur(18px) saturate(1.32);
        -webkit-backdrop-filter: blur(18px) saturate(1.32);
      }

      .loader-widget-smile {
        position: absolute;
        z-index: 1;
        inset: 50%;
        width: 60px;
        height: 60px;
        transform: translate(-50%, -50%);
        color: #7d828a;
        filter: drop-shadow(0 8px 16px rgba(35, 48, 66, 0.13));
      }

      .loader-widget-smile::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 999px;
        border: 1px dashed rgba(10, 132, 255, 0.22);
        animation: smile-spin 3.4s linear infinite;
      }

      .loader-widget-smile svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        animation: smile-spin 1.35s linear infinite;
      }

      #app-loader .loader-widget-smile svg g {
        stroke: currentcolor;
      }

      #app-loader .loader-brand {
        margin: 0;
        text-align: center;
        font-family:
          'SF Pro Display', 'Iowan Old Style', 'Noto Serif SC', 'PingFang SC', ui-serif, Georgia,
          serif;
        font-size: clamp(34px, 8vw, 46px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #1d1d1f;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.86),
          0 12px 28px rgba(50, 65, 86, 0.13);
        animation: brand-fade-up 0.9s ease-out both;
      }

      #app-loader p {
        margin: 0;
        text-align: center;
        font-family:
          'Avenir Next',
          'SF Pro Text',
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Helvetica Neue',
          Arial,
          'Noto Sans',
          sans-serif;
        font-size: 12px;
        letter-spacing: 0.15em;
        color: rgba(85, 86, 91, 0.78);
      }

      #app-loader p::after {
        content: '...';
        display: inline-block;
        width: 1.2em;
        overflow: hidden;
        vertical-align: bottom;
        animation: dots 1.5s steps(4, end) infinite;
      }

      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes smile-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes brand-fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes dots {
        from {
          width: 0;
        }
        to {
          width: 1.2em;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="app-loader">
      <div class="loader-shell" aria-hidden="true">
        <div class="loader-widget-smile">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g
              fill="none"
              stroke="#888888"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            >
              <path
                d="M12 3c4.97 0 9 4.03 9 9c0 4.97 -4.03 9 -9 9c-4.97 0 -9 -4.03 -9 -9c0 -4.97 4.03 -9 9 -9"
              />
              <path d="M9 9v1" />
              <path d="M15 9v1" />
              <path d="M8 14c0.5 1.5 1.79 3 4 3c2.21 0 3.5 -1.5 4 -3" />
            </g>
          </svg>
        </div>
      </div>
      <h1 id="app-loader-brand" class="loader-brand">Ech0</h1>
      <p>静候灵感落笔</p>
    </div>
    <script>
      ;(() => {
        const DEFAULT_TITLE = 'Ech0'
        const TITLE_STORAGE_KEY = 'ech0:loader-site-title'
        const EARLY_CUSTOM_STYLE_ID = 'ech0-early-custom-style'
        const APP_CUSTOM_STYLE_ID = 'ech0-custom-style'

        const normalizeTitle = (...values) => {
          for (const value of values) {
            const title = String(value ?? '').trim()
            if (title) return title
          }
          return DEFAULT_TITLE
        }

        const capturedErrors = []
        let hasFatalError = false

        const escapeHtml = (str) =>
          String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')

        const recordError = (err, context = '') => {
          hasFatalError = true
          const msg = (err && (err.message || String(err))) || 'Unknown error'
          const stack = (err && err.stack) || ''
          capturedErrors.push({ msg, stack, context, time: new Date().toLocaleTimeString() })
          try {
            console.error('[Ech0 Boot Diagnostic]', context, err)
          } catch (_) {}
        }

        window.__ech0ReportError = recordError
        window.addEventListener('error', (e) => {
          recordError(e.error || e.message, 'script.error')
        })
        window.addEventListener('unhandledrejection', (e) => {
          recordError(e.reason, 'promise.unhandledrejection')
        })

        const checkAndRenderFallback = () => {
          try {
            const app = document.getElementById('app')
            if (!app || app.children.length > 0) return

            const summary = capturedErrors.map((e) => e.context + ': ' + e.msg).join('\n')
            const details = capturedErrors
              .map(
                (e) =>
                  '[' + e.time + '] ' + e.context + ': ' + e.msg + (e.stack ? '\n' + e.stack : ''),
              )
              .join('\n\n')

            app.innerHTML = `
              <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif; text-align: center; color: #1d1d1f; box-sizing: border-box; background: transparent;">
                <div style="width: 58px; height: 58px; border-radius: 18px; background: rgba(255, 255, 255, 0.85); box-shadow: 0 10px 24px rgba(40,48,62,0.08); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; border: 1px solid rgba(0,0,0,0.06); -webkit-backdrop-filter: blur(12px);">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0a84ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                  </svg>
                </div>
                <h2 style="margin: 0 0 8px; font-size: 19px; font-weight: 700; color: #1d1d1f; letter-spacing: -0.01em;">页面加载未就绪</h2>
                <p style="margin: 0 0 22px; font-size: 13.5px; color: #6e6e73; max-width: 310px; line-height: 1.5;">
                  可能受内嵌浏览器缓存或网络限制影响，页面未能在预定时间内完成渲染。
                </p>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px;">
                  <button onclick="window.location.reload()" style="padding: 9px 20px; font-size: 14px; font-weight: 600; border-radius: 12px; border: none; background: #0a84ff; color: #ffffff; cursor: pointer; box-shadow: 0 4px 14px rgba(10,132,255,0.28);">
                    刷新页面
                  </button>
                  <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload();" style="padding: 9px 18px; font-size: 14px; font-weight: 500; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.85); color: #1d1d1f; cursor: pointer;">
                    清空缓存并重试
                  </button>
                </div>
                ${
                  summary
                    ? `<details style="max-width: 340px; width: 100%; text-align: left; font-size: 11.5px; color: #6e6e73; background: rgba(255,255,255,0.7); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); cursor: pointer; word-break: break-all; box-sizing: border-box;">
                        <summary style="font-weight: 600; outline: none; margin-bottom: 6px; cursor: pointer;">查看诊断信息</summary>
                        <pre style="white-space: pre-wrap; font-family: monospace; margin: 0; font-size: 11px; max-height: 160px; overflow-y: auto; color: #d70015;">${escapeHtml(details)}</pre>
                      </details>`
                    : ''
                }
              </div>
            `
          } catch (_) {}
        }

        const dismissLoader = () => {
          try {
            const loader = document.getElementById('app-loader')
            if (loader) {
              loader.classList.add('fade-out')
              setTimeout(() => {
                try {
                  loader.remove()
                } catch (_) {}
                document.documentElement.classList.remove('app-loading')
                checkAndRenderFallback()
              }, 300)
            } else {
              document.documentElement.classList.remove('app-loading')
              checkAndRenderFallback()
            }
          } catch (_) {
            document.documentElement.classList.remove('app-loading')
            checkAndRenderFallback()
          }
        }
        window.__ech0DismissLoader = dismissLoader

        // 终极防卡死兜底：无论任何内嵌浏览器（如手机QQ/沙盒WebView）发生网络、缓存或脚本执行异常，
        // 保证最多 2.5 秒后移除启动页遮罩，并自动检查页面是否成功渲染。
        setTimeout(dismissLoader, 2500)

        // 移动端调试支持：URL 携带 ?debug=1 或 ?vconsole=1 时自动加载 vConsole
        try {
          const urlParams = new URLSearchParams(window.location.search)
          if (urlParams.has('debug') || urlParams.has('vconsole')) {
            const s = document.createElement('script')
            s.src = 'https://unpkg.com/vconsole@latest/dist/vconsole.min.js'
            s.onload = () => {
              if (window.VConsole) new window.VConsole()
            }
            document.head.appendChild(s)
          }
        } catch (_) {}

        // 连续点击启动页品牌标题 5 次快速呼出 vConsole（方便手机QQ现场排查）
        let brandTapCount = 0
        let brandTapTimer = null
        const loaderBrandEl = document.getElementById('app-loader-brand')
        if (loaderBrandEl) {
          loaderBrandEl.addEventListener('click', () => {
            brandTapCount++
            if (brandTapTimer) clearTimeout(brandTapTimer)
            brandTapTimer = setTimeout(() => {
              brandTapCount = 0
            }, 1500)
            if (brandTapCount >= 5) {
              brandTapCount = 0
              const s = document.createElement('script')
              s.src = 'https://unpkg.com/vconsole@latest/dist/vconsole.min.js'
              s.onload = () => {
                if (window.VConsole) new window.VConsole()
              }
              document.head.appendChild(s)
            }
          })
        }

        const applyTitle = (title) => {
          try {
            const normalized = normalizeTitle(title)
            const brand = document.getElementById('app-loader-brand')
            if (brand) brand.textContent = normalized
            if (normalized && normalized !== DEFAULT_TITLE) {
              document.title = normalized
              const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]')
              if (appleTitle) appleTitle.setAttribute('content', normalized)
              const ogTitle = document.querySelector('meta[property="og:title"]')
              if (ogTitle) ogTitle.setAttribute('content', normalized)
            }
          } catch (_) {}
        }

        const upsertEarlyCustomStyle = (css) => {
          try {
            const normalized = String(css || '').trim()
            if (!normalized || !document.head) return
            if (document.getElementById(APP_CUSTOM_STYLE_ID)) return
            const existing = document.getElementById(EARLY_CUSTOM_STYLE_ID)
            if (existing) {
              existing.textContent = normalized
              return
            }
            const style = document.createElement('style')
            style.id = EARLY_CUSTOM_STYLE_ID
            style.textContent = normalized
            document.head.appendChild(style)
          } catch (_) {}
        }

        try {
          applyTitle(window.localStorage.getItem(TITLE_STORAGE_KEY))
        } catch {
          applyTitle(DEFAULT_TITLE)
        }

        fetch('/api/settings', {
          method: 'GET',
          credentials: 'include',
          headers: {
            Accept: 'application/json',
          },
        })
          .then((response) => {
            if (!response.ok) throw new Error('Failed to load settings')
            return response.json()
          })
          .then((response) => {
            const data = response?.data || {}
            const title = normalizeTitle(data.server_name, data.site_title)
            applyTitle(title)
            upsertEarlyCustomStyle(data.custom_css)
            try {
              window.localStorage.setItem(TITLE_STORAGE_KEY, title)
            } catch {
              // Ignore storage failures in private mode or locked-down browsers.
            }
          })
          .catch(() => {
            // Keep the cached/fallback title; the Vue app will sync again after boot.
          })
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
