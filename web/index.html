    <script>
      // The app theme is a user choice, not the OS preference. Resolve it before the first
      // paint so no browser surface (PWA title bar / status bar, UA canvas behind transparent
      // areas) falls back to prefers-color-scheme. Keep the map in sync with
      // THEME_COLOR_FALLBACK in src/stores/theme.ts; that store re-syncs after hydration.
      ;(() => {
        const fallback = { light: '#f4f1ec', sunny: '#eeece6', dark: '#333333' }
        let theme = 'light'
        try {
          const raw = localStorage.getItem('themeMode')
          let saved = raw
          try {
            saved = JSON.parse(raw)
          } catch {}
          if (saved === 'light' || saved === 'sunny' || saved === 'dark') theme = saved
        } catch {
          // Malformed storage: fall through to the light default.
        }
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', fallback[theme])
      })()
    </script>
    <script>
      ;(function () {
        try {
          var item = localStorage.getItem('ech0:cached_system_setting')
          if (item && (document.title === 'Ech0' || document.title === 'Echo')) {
            var data = JSON.parse(item)
            if (
              data &&
              data.site_title &&
              data.site_title !== 'Ech0' &&
              data.site_title !== 'Echo'
            ) {
              var p = window.location.pathname || ''
              if (p.indexOf('/echo/') === 0) {
                document.title = '\u52a8\u6001\u8be6\u60c5 | ' + data.site_title
              } else {
                document.title = data.site_title
              }
            }
          }
        } catch (e) {}
      })()
    </script>

    <meta name="author" content="Ech0 Team" />
    <meta name="generator" content="Ech0" />

    <style>
      html.app-loading,
      html.app-loading body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #app-loader {
        --loader-ink: #1d1d1f;
        --loader-muted: #666b76;
        --loader-glass: rgba(255, 255, 255, 0.6);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        padding: 24px;
        color: var(--loader-ink);
        background:
          radial-gradient(circle at 88% 0%, rgba(10, 132, 255, 0.15), transparent 31rem),
          linear-gradient(135deg, #fbfcfe, #edf4fb);
        font-family: 'SF Pro Display', 'PingFang SC', system-ui, sans-serif;
        transition:
          opacity 0.28s ease,
          visibility 0.28s ease;
      }
      @media (prefers-color-scheme: dark) {
        html:not([style*='color-scheme: light']) #app-loader {
          --loader-ink: #f3f5fa;
          --loader-muted: #aeb7c6;
          --loader-glass: rgba(48, 58, 76, 0.6);
          background:
            radial-gradient(circle at 88% 0%, rgba(10, 132, 255, 0.15), transparent 31rem), #151b25;
        }
      }
      html[style*='color-scheme: dark'] #app-loader {
        --loader-ink: #f3f5fa;
        --loader-muted: #aeb7c6;
        --loader-glass: rgba(48, 58, 76, 0.6);
        background:
          radial-gradient(circle at 88% 0%, rgba(10, 132, 255, 0.15), transparent 31rem), #151b25;
      }
      #loader-identity {
        display: grid;
        justify-items: center;
        gap: 24px;
      }
      #loader-logo {
        width: 76px;
        height: 76px;
        padding: 8px;
        object-fit: contain;
        border-radius: 24px;
        background: var(--loader-glass);
        box-shadow: 0 12px 36px rgba(30, 54, 90, 0.13);
        backdrop-filter: blur(18px) saturate(1.3);
      }
      #loader-logo[hidden],
      #loader-retry[hidden] {
        display: none;
      }
      #app-loader .loader-brand {
        margin: 0;
        max-width: min(86vw, 900px);
        text-align: center;
        overflow-wrap: anywhere;
        font-size: clamp(28px, 5vw, 46px);
        font-weight: 800;
        line-height: 1.4;
        letter-spacing: -0.025em;
        animation: brand-fade-up 0.7s ease-out both;
      }
      #app-loader .loader-brand span {
        display: inline-block;
        white-space: pre;
        transform-origin: center bottom;
        animation: letter-hop 2s ease-in-out infinite;
        animation-delay: calc(var(--letter-index, 0) * 90ms);
      }
      #app-loader .loader-brand span:nth-child(odd) {
        --tilt: -4deg;
      }
      #app-loader .loader-brand span:nth-child(even) {
        --tilt: 4deg;
      }
      #app-loader p {
        margin: 0;
        text-align: center;
        font-size: 13px;
        color: var(--loader-muted);
      }
      #loader-retry {
        padding: 10px 18px;
        border-radius: 16px;
        color: inherit;
        background: var(--loader-glass);
      }
      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-loader[data-failed] .loader-brand span {
        animation: none;
      }
      @keyframes letter-hop {
        0%,
        40%,
        100% {
          transform: translateY(0) scale(1) rotate(0deg);
        }
        10% {
          transform: translateY(0.04em) scale(1.08, 0.92) rotate(0deg);
        }
        22% {
          transform: translateY(-0.3em) scale(0.96, 1.05) rotate(var(--tilt, 0deg));
        }
        32% {
          transform: translateY(0) scale(1.06, 0.94) rotate(0deg);
        }
      }
      @keyframes brand-fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader,
        #app-loader *,
        #app-loader *::after,
        #app-loader *::before {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

  <body>
    <div id="app">
      <!--ECH0_NOSCRIPT_START-->
      <!--ECH0_NOSCRIPT_END-->
    </div>
    <div id="app-loader" role="status" aria-live="polite" aria-busy="true">
      <div id="loader-identity" data-server-brand="false">
        <img id="loader-logo" alt="" hidden />
        <h1 class="loader-brand" aria-label="Loading"><span aria-hidden="true">Loading</span></h1>
      </div>
      <p id="loader-status">静候灵感落笔</p>
      <a id="loader-retry" href="" hidden>重新加载 / Reload</a>
    </div>
    <noscript
      ><style>
        #app-loader {
          display: none;
        }
        html.app-loading,
        html.app-loading body {
          overflow: auto;
          height: auto;
        }
      </style></noscript
    >
    <script id="startup-loader-guard">
      // Works before Vue (including a failed module download). No user HTML is evaluated.
      ;(function () {
        var loader = document.getElementById('app-loader')
        var identity = document.getElementById('loader-identity')
        var logo = document.getElementById('loader-logo')
        if (!loader || !identity) return
        try {
          if (identity.dataset.serverBrand !== 'true') {
            var raw = localStorage.getItem('ech0:cached_system_setting')
            var setting = raw ? JSON.parse(raw) : null
            var title = setting && setting.site_title
            if (typeof title === 'string' && title.trim() && title !== 'Ech0' && title !== 'Echo') {
              var brand = identity.querySelector('.loader-brand')
              brand.textContent = ''
              brand.setAttribute('aria-label', title)
              Array.from(title).forEach(function (letter, index) {
                var span = document.createElement('span')
                span.textContent = letter
                span.setAttribute('aria-hidden', 'true')
                span.style.setProperty('--letter-index', String(index % 8))
                brand.appendChild(span)
              })
              var src = setting.server_logo
              if (
                typeof src === 'string' &&
                /^(https?:\/\/|\/(?!\/))/.test(src) &&
                !/^\/(?:r?Ech0|favicon)(?:\.|\/)/i.test(src)
              ) {
                logo.src = src
                logo.hidden = false
              }
            }
          }
        } catch (e) {}
        function failed() {
          if (!loader.isConnected) return
          loader.dataset.failed = 'true'
          loader.setAttribute('aria-busy', 'false')
          loader.setAttribute('role', 'alert')
          document.getElementById('loader-status').textContent =
            '加载未完成，请检查网络后重试 / Loading interrupted'
          document.getElementById('loader-retry').hidden = false
        }
        function resourceError(event) {
          if (event.target === logo) logo.hidden = true
          if (event.target && event.target.tagName === 'SCRIPT' && event.target.type === 'module')
            failed()
        }
        var watchdog = window.setTimeout(failed, 15000)
        window.addEventListener('error', resourceError, true)
        window.addEventListener('ech0:startup-failed', failed)
        window.addEventListener(
          'ech0:startup-ready',
          function () {
            window.clearTimeout(watchdog)
            window.removeEventListener('error', resourceError, true)
            window.removeEventListener('ech0:startup-failed', failed)
          },
          { once: true },
        )
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
