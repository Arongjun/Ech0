    <script>
      // The app theme is a user choice, not the OS preference. Resolve it before the first
      // paint so no browser surface (PWA title bar / status bar, UA canvas behind transparent
      // areas) falls back to prefers-color-scheme. Keep the map in sync with
      // THEME_COLOR_FALLBACK in src/stores/theme.ts; that store re-syncs after hydration.
      ;(() => {
        const fallback = { light: '#f4f1ec', sunny: '#eeece6', dark: '#333333' }
        let theme = 'light'
        try {
          const saved = JSON.parse(localStorage.getItem('themeMode'))
          if (saved === 'light' || saved === 'sunny' || saved === 'dark') theme = saved
        } catch {
          // Malformed storage: fall through to the light default.
        }
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', fallback[theme])
      })()
    </script>
    <script>
      ;(function () {
        try {
          var item = localStorage.getItem('ech0:cached_system_setting')
          if (item) {
            var data = JSON.parse(item)
            if (
              data &&
              data.site_title &&
              data.site_title !== 'Ech0' &&
              data.site_title !== 'Echo'
            ) {
              var p = window.location.pathname || ''
              if (p.indexOf('/echo/') === 0) {
                document.title = '\u52a8\u6001\u8be6\u60c5 | ' + data.site_title
              } else {
                document.title = data.site_title
              }
            }
          }
        } catch (e) {}
      })()
    </script>

    <style>
      html.app-loading,
      html.app-loading body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        gap: 16px;
        color: #1d1d1f;
        background:
          radial-gradient(circle at 18% -10%, rgba(255, 255, 255, 0.98), transparent 25rem),
          radial-gradient(circle at 88% 0%, rgba(10, 132, 255, 0.16), transparent 31rem),
          radial-gradient(circle at 56% 48%, rgba(255, 255, 255, 0.68), transparent 23rem),
          linear-gradient(135deg, #fbfcfe 0%, #f6f9fc 44%, #edf4fb 100%);
        transition:
          opacity 0.28s ease,
          visibility 0.28s ease;
      }

      #app-loader::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 15px,
            rgba(10, 132, 255, 0.026) 16px
          ),
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 15px,
            rgba(31, 38, 50, 0.018) 16px
          );
        pointer-events: none;
      }

      .loader-shell {
        width: 94px;
        height: 94px;
        margin: 0 auto;
        position: relative;
      }

      .loader-shell::after {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.72);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 16px 34px rgba(42, 55, 74, 0.1),
          0 2px 8px rgba(42, 55, 74, 0.055);
        backdrop-filter: blur(18px) saturate(1.32);
        -webkit-backdrop-filter: blur(18px) saturate(1.32);
      }

      .loader-widget-smile {
        position: absolute;
        z-index: 1;
        inset: 50%;
        width: 60px;
        height: 60px;
        transform: translate(-50%, -50%);
        color: #7d828a;
        filter: drop-shadow(0 8px 16px rgba(35, 48, 66, 0.13));
      }

      .loader-widget-smile::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 999px;
        border: 1px dashed rgba(10, 132, 255, 0.22);
        animation: smile-spin 3.4s linear infinite;
      }

      .loader-widget-smile svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        animation: smile-spin 1.35s linear infinite;
      }

      #app-loader .loader-widget-smile svg g {
        stroke: currentcolor;
      }

      #app-loader .loader-brand {
        margin: 0;
        display: flex;
        justify-content: center;
        text-align: center;
        font-family:
          'SF Pro Display', 'Iowan Old Style', 'Noto Serif SC', 'PingFang SC', ui-serif, Georgia,
          serif;
        font-size: clamp(34px, 8vw, 46px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #1d1d1f;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.86),
          0 12px 28px rgba(50, 65, 86, 0.13);
        animation: brand-fade-up 0.9s ease-out both;
      }

      #app-loader p {
        margin: 0;
        text-align: center;
        font-family:
          'Avenir Next',
          'SF Pro Text',
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Helvetica Neue',
          Arial,
          'Noto Sans',
          sans-serif;
        font-size: 12px;
        letter-spacing: 0.15em;
        color: rgba(85, 86, 91, 0.78);
      }

      #app-loader p::after {
        content: '...';
        display: inline-block;
        width: 1.2em;
        overflow: hidden;
        vertical-align: bottom;
        animation: dots 1.5s steps(4, end) infinite;
      }

      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes letter-hop {
        0%,
        40%,
        100% {
          transform: translateY(0) scale(1) rotate(0deg);
        }
        10% {
          transform: translateY(0.04em) scale(1.08, 0.92) rotate(0deg);
        }
        22% {
          transform: translateY(-0.3em) scale(0.96, 1.05) rotate(var(--tilt, 0deg));
        }
        32% {
          transform: translateY(0) scale(1.06, 0.94) rotate(0deg);
        }
      }

      @keyframes brand-fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes dots {
        from {
          width: 0;
        }
        to {
          width: 1.2em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader .loader-brand,
        #app-loader .loader-brand span,
        #app-loader p,
        #app-loader p::after {
          animation: none;
        }
      }
    </style>
