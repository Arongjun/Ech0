      {
        "@context": "https://schema.org",

    <style>
      html.app-loading,
      html.app-loading body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        gap: 16px;
        color: #1d1d1f;
        background:
          radial-gradient(circle at 18% -10%, rgba(255, 255, 255, 0.98), transparent 25rem),
          radial-gradient(circle at 88% 0%, rgba(10, 132, 255, 0.16), transparent 31rem),
          radial-gradient(circle at 56% 48%, rgba(255, 255, 255, 0.68), transparent 23rem),
          linear-gradient(135deg, #fbfcfe 0%, #f6f9fc 44%, #edf4fb 100%);
        transition:
          opacity 0.28s ease,
          visibility 0.28s ease;
      }

      #app-loader::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 15px,
            rgba(10, 132, 255, 0.026) 16px
          ),
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 15px,
            rgba(31, 38, 50, 0.018) 16px
          );
        pointer-events: none;
      }

      .loader-shell {
        width: 94px;
        height: 94px;
        margin: 0 auto;
        position: relative;
      }

      .loader-shell::after {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.72);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          0 16px 34px rgba(42, 55, 74, 0.1),
          0 2px 8px rgba(42, 55, 74, 0.055);
        backdrop-filter: blur(18px) saturate(1.32);
        -webkit-backdrop-filter: blur(18px) saturate(1.32);
      }

      .loader-widget-smile {
        position: absolute;
        z-index: 1;
        inset: 50%;
        width: 60px;
        height: 60px;
        transform: translate(-50%, -50%);
        color: #7d828a;
        filter: drop-shadow(0 8px 16px rgba(35, 48, 66, 0.13));
      }

      .loader-widget-smile::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 999px;
        border: 1px dashed rgba(10, 132, 255, 0.22);
        animation: smile-spin 3.4s linear infinite;
      }

      .loader-widget-smile svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        animation: smile-spin 1.35s linear infinite;
      }

      #app-loader .loader-widget-smile svg g {
        stroke: currentcolor;
      }

      #app-loader .loader-brand {
        margin: 0;
        text-align: center;
        font-family:
          'SF Pro Display', 'Iowan Old Style', 'Noto Serif SC', 'PingFang SC', ui-serif, Georgia,
          serif;
        font-size: clamp(34px, 8vw, 46px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        color: #1d1d1f;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.86),
          0 12px 28px rgba(50, 65, 86, 0.13);
        animation: brand-fade-up 0.9s ease-out both;
      }

      #app-loader p {
        margin: 0;
        text-align: center;
        font-family:
          'Avenir Next',
          'SF Pro Text',
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Helvetica Neue',
          Arial,
          'Noto Sans',
          sans-serif;
        font-size: 12px;
        letter-spacing: 0.15em;
        color: rgba(85, 86, 91, 0.78);
      }

      #app-loader p::after {
        content: '...';
        display: inline-block;
        width: 1.2em;
        overflow: hidden;
        vertical-align: bottom;
        animation: dots 1.5s steps(4, end) infinite;
      }

      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes smile-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes brand-fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes dots {
        from {
          width: 0;
        }
        to {
          width: 1.2em;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <div id="app-loader">
      <div class="loader-shell" aria-hidden="true">
        <div class="loader-widget-smile">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g
              fill="none"
              stroke="#888888"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            >
              <path
                d="M12 3c4.97 0 9 4.03 9 9c0 4.97 -4.03 9 -9 9c-4.97 0 -9 -4.03 -9 -9c0 -4.97 4.03 -9 9 -9"
              />
              <path d="M9 9v1" />
              <path d="M15 9v1" />
              <path d="M8 14c0.5 1.5 1.79 3 4 3c2.21 0 3.5 -1.5 4 -3" />
            </g>
          </svg>
        </div>
      </div>
      <h1 class="loader-brand">Ech0</h1>
      <p>静候灵感落笔</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
